# PostgreSQL with the pgvector extension preinstalled.
# Start:  docker compose up -d
# Stop:   docker compose down       (add -v to also wipe data)
#
# Port 5433 on the host (not 5432) to avoid clashing with any local Postgres.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: betsy-db
    environment:
      POSTGRES_USER: betsy
      POSTGRES_PASSWORD: betsy
      POSTGRES_DB: betsy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betsy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
