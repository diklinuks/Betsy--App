<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Betsy{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/betsy.css">
  <style>
    body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .nums, table td, table th { font-family: "JetBrains Mono", ui-monospace, monospace; }
  </style>
</head>
<body class="text-slate-800">
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-6 py-3.5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-semibold text-lg text-white">
        <span class="grid place-items-center w-7 h-7 rounded-lg bg-emerald-400/15 text-emerald-400 font-mono font-bold">B</span>
        Betsy
        <span class="text-slate-400 font-normal text-sm">· Autonomous Procurement</span>
      </a>
      <nav class="flex gap-5 text-sm text-slate-300">
        <a href="/" class="hover:text-white">Dashboard</a>
        <a href="/activity" class="hover:text-white">Activity</a>
        <a href="/decisions" class="hover:text-white">Decisions</a>
        <a href="/deliveries" class="hover:text-white">Deliveries</a>
        <a href="/invoices" class="hover:text-white">Invoices</a>
        <a href="/config" class="hover:text-white">Config</a>
        <a href="/report" class="hover:text-white">Report</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
