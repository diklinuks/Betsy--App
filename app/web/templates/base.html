<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Betsy{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-semibold text-lg">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Betsy
        <span class="text-slate-400 font-normal text-sm">· Autonomous Procurement</span>
      </a>
      <nav class="flex gap-5 text-sm text-slate-300">
        <a href="/" class="hover:text-white">Dashboard</a>
        <a href="/decisions" class="hover:text-white">Decisions</a>
        <a href="/deliveries" class="hover:text-white">Deliveries</a>
        <a href="/invoices" class="hover:text-white">Invoices</a>
        <a href="/config" class="hover:text-white">Config</a>
        <a href="/report" class="hover:text-white">Report</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
