{% extends "base.html" %}
{% block title %}Betsy · Dashboard{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-semibold">Simulation control</h1>
    <p class="text-slate-500 text-sm">90-day procurement simulation. Betsy runs autonomously and pauses for your approval on high-value decisions.</p>
  </div>
  <div class="flex flex-wrap gap-2">
    <form method="post" action="/run"><button class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">▶ Run</button></form>
    <form method="post" action="/run-reset"><button class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">↻ Reset &amp; run</button></form>
    <form method="post" action="/pause"><button class="px-4 py-2 rounded-lg bg-amber-500 text-white text-sm font-medium hover:bg-amber-600">⏸ Pause</button></form>
    <form method="post" action="/resume"><button class="px-4 py-2 rounded-lg bg-sky-600 text-white text-sm font-medium hover:bg-sky-700">⏵ Resume</button></form>
    <form method="post" action="/stop"><button class="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-medium hover:bg-rose-700">■ Stop</button></form>
  </div>
</div>

<!-- Loaded once; the fragment refreshes itself only when it is safe to (see live.html) -->
<div id="live" hx-get="/fragment/live" hx-trigger="load" hx-swap="innerHTML">
  <p class="text-slate-400 text-sm">Loading…</p>
</div>
{% endblock %}
